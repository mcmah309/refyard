[workspace]
resolver = "3"
members = ["rs/refyard"]
exclude = []

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
eros = { version = "0.8", features = ["user_context"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
yaml_serde = "0.10"
