[package]
name = "refyard"
description = "Track shared file and directory references across repositories"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
# repository = ""
license = "Apache-2.0"
# categories = []
# keywords = []
# documentation = "" # Alternative documentation
# rust-version = "" # Min required rust version

[[bin]]
name = "refyard"
path = "src/main.rs"

[dependencies]
clap.workspace = true
directories.workspace = true
eros.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
yaml_serde.workspace = true

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"] # Used in the root .rs file to enable `#![cfg_attr(docsrs, feature(doc_cfg))]`
